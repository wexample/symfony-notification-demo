en:
  page_title: Notifications
  page_icon: ph:bold/bell
  intro: Telling people what they must know now. Every notification lands in the inbox; the mail is a channel each one may turn off, per category. In development the mails land in the mailbox.
  inbox: Inbox
  preferences: Preferences
  sign_in: Sign in with a test account of the user demo to receive notifications.
  sign_in_open: Test accounts
  sent: Sent. It is in your inbox, and in the mailbox unless you turned the mail off.
  sent_none: Nothing sent — you were reminded less than an hour ago.
  levels:
    title: Send yourself one
    intro: One category per level, sent to you alone.
    info: Information
    success: Success
    warning: Warning
    danger: Danger
  reminder:
    title: A reminder, once an hour
    intro: Sent with notifyOnce() — pressing again within the hour sends nothing, the way a daily reminder reaches each person once per window.
    send: Remind me
  teams:
    title: The teams tell their members
    intro: Adding someone to a team of the user demo, changing their access or removing them notifies them — and, on arrival, the other administrators.
    open: Open the teams

fr:
  page_title: Notifications
  page_icon: 'ph:bold/bell'
  intro: "Informer les gens de ce qu'ils doivent savoir maintenant. Chaque notification arrive dans la boîte de réception ; le mail est un canal que chacun peut désactiver, par catégorie. En développement, les mails arrivent dans la boîte aux lettres."
  inbox: 'Boîte de réception'
  preferences: Préférences
  sign_in: 'Connectez-vous avec un compte de test de la démo utilisateur pour recevoir des notifications.'
  sign_in_open: 'Comptes de test'
  sent: "Envoyé. C'est dans votre boîte de réception et dans la boîte aux lettres, à moins que vous n'ayez désactivé le mail."
  sent_none: "Rien envoyé — vous avez été rappelé il y a moins d'une heure."
  levels:
    title: 'Envoyez-vous un message'
    intro: 'Une catégorie par niveau, envoyée uniquement à vous.'
    info: Information
    success: Succès
    warning: Avertissement
    danger: Danger
  reminder:
    title: 'Un rappel, une fois par heure'
    intro: "Envoyé avec notifyOnce() — appuyer à nouveau dans l'heure n'envoie rien, comme un rappel quotidien atteint chaque personne une fois par fenêtre."
    send: Rappelez-moi
  teams:
    title: 'Les équipes informent leurs membres'
    intro: "Ajouter quelqu'un à une équipe de la démo utilisateur, changer son accès ou le retirer le notifie — et, à son arrivée, les autres administrateurs."
    open: 'Ouvrir les équipes'

zh:
  page_title: 通知
  page_icon: 'ph:bold/bell'
  intro: 告诉人们他们现在必须知道的事情。每个通知都会出现在收件箱中；邮件是每个人可以按类别关闭的渠道。在开发中，邮件会发送到邮箱。
  inbox: 收件箱
  preferences: 偏好设置
  sign_in: 使用用户演示的测试帐户登录以接收通知。
  sign_in_open: 测试帐户
  sent: 已发送。它在您的收件箱中，除非您关闭了邮件功能，邮件也会在邮箱中。
  sent_none: '未发送任何内容 — 您在不到一个小时前已收到提醒。'
  levels:
    title: 给自己发送一个
    intro: 每个级别一个类别，仅发送给您。
    info: 信息
    success: 成功
    warning: 警告
    danger: 危险
  reminder:
    title: 每小时一次的提醒
    intro: '使用notifyOnce()发送 — 在一小时内再次按下不会发送任何内容，就像每日提醒每人每个窗口只到一次。'
    send: 提醒我
  teams:
    title: 团队通知他们的成员
    intro: '将某人添加到用户演示的团队中，改变他们的访问权限或将其移除会通知他们 — 并且在到达时通知其他管理员。'
    open: 打开团队

ar:
  page_title: الإشعارات
  page_icon: 'ph:bold/bell'
  intro: 'إعلام الناس بما يجب أن يعرفوه الآن. كل إشعار يصل إلى صندوق الوارد؛ البريد هو قناة يمكن لكل شخص إيقافها، حسب الفئة. في التطوير، تصل الرسائل إلى صندوق البريد.'
  inbox: 'صندوق الوارد'
  preferences: التفضيلات
  sign_in: 'قم بتسجيل الدخول باستخدام حساب اختبار من عرض المستخدم لتلقي الإشعارات.'
  sign_in_open: 'حسابات الاختبار'
  sent: 'تم الإرسال. إنه في صندوق الوارد لديك، وفي صندوق البريد ما لم تقم بإيقاف البريد.'
  sent_none: 'لم يتم إرسال أي شيء — تم تذكيرك منذ أقل من ساعة.'
  levels:
    title: 'أرسل لنفسك واحدة'
    intro: 'فئة واحدة لكل مستوى، تُرسل إليك وحدك.'
    info: معلومات
    success: نجاح
    warning: تحذير
    danger: خطر
  reminder:
    title: 'تذكير، مرة كل ساعة'
    intro: 'يتم الإرسال باستخدام notifyOnce() — الضغط مرة أخرى خلال الساعة لا يرسل شيئًا، كما يصل التذكير اليومي إلى كل شخص مرة واحدة في كل نافذة.'
    send: ذكرني
  teams:
    title: 'الفرق تخبر أعضائها'
    intro: 'إضافة شخص إلى فريق عرض المستخدم، تغيير وصوله أو إزالته يُعلمهم — وعند الوصول، يُعلم باقي المسؤولين.'
    open: 'فتح الفرق'

hi:
  page_title: सूचनाएँ
  page_icon: 'ph:bold/bell'
  intro: 'लोगों को जो उन्हें अभी जानना चाहिए, वह बताना। हर सूचना इनबॉक्स में आती है; मेल एक चैनल है जिसे प्रत्येक श्रेणी के अनुसार बंद किया जा सकता है। विकास में मेल मेलबॉक्स में आते हैं।'
  inbox: इनबॉक्स
  preferences: प्राथमिकताएँ
  sign_in: 'सूचनाएँ प्राप्त करने के लिए उपयोगकर्ता डेमो के परीक्षण खाते से साइन इन करें।'
  sign_in_open: 'परीक्षण खाते'
  sent: 'भेजा गया। यह आपके इनबॉक्स में है, और मेलबॉक्स में है जब तक आपने मेल बंद नहीं किया।'
  sent_none: 'कुछ नहीं भेजा गया — आपको एक घंटे से कम समय पहले याद दिलाया गया था।'
  levels:
    title: 'अपने लिए एक भेजें'
    intro: 'प्रति स्तर एक श्रेणी, केवल आपके लिए भेजी गई।'
    info: सूचना
    success: सफलता
    warning: चेतावनी
    danger: खतरा
  reminder:
    title: 'एक अनुस्मारक, हर घंटे'
    intro: 'notifyOnce() के साथ भेजा गया — एक घंटे के भीतर फिर से दबाने पर कुछ नहीं भेजा जाता, जैसे दैनिक अनुस्मारक हर व्यक्ति तक एक बार पहुँचता है।'
    send: 'मुझे याद दिलाएँ'
  teams:
    title: 'टीमें अपने सदस्यों को बताती हैं'
    intro: 'उपयोगकर्ता डेमो की टीम में किसी को जोड़ना, उनकी पहुँच बदलना या उन्हें हटाना उन्हें सूचित करता है — और, आगमन पर, अन्य प्रशासकों को।'
    open: 'टीम खोलें'

he:
  page_title: התראות
  page_icon: 'ph:bold/bell'
  intro: 'ליידע אנשים מה הם חייבים לדעת עכשיו. כל התראה מגיעה לתיבת הדואר; הדואר הוא ערוץ שכל אחד יכול לכבות, לפי קטגוריה. במהלך הפיתוח, המיילים מגיעים לתיבת הדואר.'
  inbox: 'תיבת דואר'
  preferences: העדפות
  sign_in: 'התחבר עם חשבון בדיקה של הדמו כדי לקבל התראות.'
  sign_in_open: 'חשבונות בדיקה'
  sent: 'נשלח. זה נמצא בתיבת הדואר שלך, ובתיבת הדואר אלא אם כיבית את המייל.'
  sent_none: 'לא נשלח כלום — קיבלת תזכורת לפני פחות משעה.'
  levels:
    title: 'שלח לעצמך אחד'
    intro: 'קטגוריה אחת לכל רמה, נשלחת אליך בלבד.'
    info: מידע
    success: הצלחה
    warning: אזהרה
    danger: סכנה
  reminder:
    title: 'תזכורת, פעם בשעה'
    intro: 'נשלח עם notifyOnce() — לחיצה שוב בתוך השעה לא שולחת כלום, כמו תזכורת יומית שמגיעה לכל אדם פעם בכל חלון.'
    send: 'תזכיר לי'
  teams:
    title: 'הצוותים מודיעים לחבריהם'
    intro: 'הוספת מישהו לצוות של הדמו, שינוי הגישה שלו או הסרתו מיידעת אותם — ובכניסתם, את שאר המנהלים.'
    open: 'פתח את הצוותים'

fa:
  page_title: اعلان‌ها
  page_icon: 'ph:bold/bell'
  intro: 'اطلاع‌رسانی به افراد درباره مواردی که اکنون باید بدانند. هر اعلان در صندوق ورودی قرار می‌گیرد؛ ایمیل یک کانال است که هر شخص می‌تواند آن را بر اساس دسته‌بندی خاموش کند. در حال توسعه، ایمیل‌ها در صندوق پستی قرار می‌گیرند.'
  inbox: 'صندوق ورودی'
  preferences: تنظیمات
  sign_in: 'با یک حساب آزمایشی کاربر دمو وارد شوید تا اعلان‌ها را دریافت کنید.'
  sign_in_open: 'حساب‌های آزمایشی'
  sent: 'ارسال شد. در صندوق ورودی شما قرار دارد و در صندوق پستی مگر اینکه ایمیل را خاموش کرده باشید.'
  sent_none: 'هیچ چیزی ارسال نشد — کمتر از یک ساعت پیش به شما یادآوری شد.'
  levels:
    title: 'یک یادآوری برای خودتان ارسال کنید'
    intro: 'یک دسته برای هر سطح، فقط برای شما ارسال می‌شود.'
    info: اطلاعات
    success: موفقیت
    warning: هشدار
    danger: خطر
  reminder:
    title: 'یک یادآوری، هر ساعت یک بار'
    intro: 'با notifyOnce() ارسال می‌شود — فشار دادن دوباره در طول یک ساعت هیچ چیزی ارسال نمی‌کند، همان‌طور که یک یادآوری روزانه به هر نفر یک بار در هر پنجره می‌رسد.'
    send: 'به من یادآوری کن'
  teams:
    title: 'تیم‌ها به اعضای خود اطلاع‌رسانی می‌کنند'
    intro: 'اضافه کردن شخصی به یک تیم از کاربر دمو، تغییر دسترسی یا حذف آنها به آنها اطلاع می‌دهد — و، با ورود، سایر مدیران را نیز مطلع می‌کند.'
    open: 'تیم‌ها را باز کنید'

ur:
  page_title: نوٹیفکیشنز
  page_icon: 'ph:bold/bell'
  intro: 'لوگوں کو وہ معلومات بتانا جو انہیں فوری طور پر جاننا ضروری ہے۔ ہر نوٹیفکیشن ان باکس میں آتا ہے؛ میل ایک چینل ہے جسے ہر کوئی زمرے کے لحاظ سے بند کر سکتا ہے۔ ترقی کے دوران میل باکس میں آتی ہیں۔'
  inbox: 'ان باکس'
  preferences: ترجیحات
  sign_in: 'نوٹیفکیشنز حاصل کرنے کے لیے ایک ٹیسٹ اکاؤنٹ کے ساتھ سائن ان کریں۔'
  sign_in_open: 'ٹیسٹ اکاؤنٹس'
  sent: 'بھیجا گیا۔ یہ آپ کے ان باکس میں ہے، اور میل باکس میں ہے جب تک کہ آپ نے میل بند نہ کی ہو۔'
  sent_none: 'کچھ نہیں بھیجا گیا — آپ کو ایک گھنٹہ پہلے یاد دلائی گئی تھی۔'
  levels:
    title: 'اپنے آپ کو ایک بھیجیں'
    intro: 'ہر سطح کے لیے ایک زمرہ، صرف آپ کے لیے بھیجا گیا۔'
    info: معلومات
    success: کامیابی
    warning: خبردار
    danger: خطرہ
  reminder:
    title: 'یاد دہانی، ہر گھنٹے میں ایک بار'
    intro: 'notifyOnce() کے ساتھ بھیجی گئی — ایک گھنٹے کے اندر دوبارہ دبانے سے کچھ نہیں بھیجا جاتا، جیسے روزانہ کی یاد دہانی ہر شخص کو ایک بار ہر ونڈو میں پہنچتی ہے۔'
    send: 'یاد دہانی کرائیں'
  teams:
    title: 'ٹیمیں اپنے ارکان کو بتاتی ہیں'
    intro: 'صارف کے ڈیمو کی ٹیم میں کسی کو شامل کرنا، ان کی رسائی کو تبدیل کرنا یا انہیں ہٹانا انہیں مطلع کرتا ہے — اور، آمد پر، دوسرے منتظمین کو بھی۔'
    open: 'ٹیمیں کھولیں'

ja:
  page_title: 通知
  page_icon: 'ph:bold/bell'
  intro: 今知っておくべきことを人々に伝えます。すべての通知は受信トレイに届きます。メールは各カテゴリごとにオフにできるチャンネルです。開発中はメールがメールボックスに届きます。
  inbox: 受信トレイ
  preferences: 設定
  sign_in: 通知を受け取るためにユーザーデモのテストアカウントでサインインしてください。
  sign_in_open: テストアカウント
  sent: 送信済み。受信トレイに入っており、メールをオフにしない限りメールボックスにもあります。
  sent_none: '何も送信されていません — あなたは1時間未満前にリマインドされました。'
  levels:
    title: 自分に1つ送信する
    intro: レベルごとに1つのカテゴリ、あなたのみに送信されます。
    info: 情報
    success: 成功
    warning: 警告
    danger: 危険
  reminder:
    title: 1時間ごとのリマインダー
    intro: 'notifyOnce()で送信されます — 1時間以内に再度押しても何も送信されず、毎日のリマインダーが各人に1回届くようにします。'
    send: リマインドして
  teams:
    title: チームはメンバーに通知します
    intro: 'ユーザーデモのチームに誰かを追加したり、アクセスを変更したり、削除したりすると、通知が届きます — 到着時に他の管理者にも通知されます。'
    open: チームを開く

ko:
  page_title: 알림
  page_icon: 'ph:bold/bell'
  intro: '사람들에게 지금 알아야 할 사항을 알립니다. 모든 알림은 수신함으로 들어오며, 메일은 각 카테고리별로 끌 수 있는 채널입니다. 개발 중에는 메일이 우편함에 도착합니다.'
  inbox: 수신함
  preferences: '환경 설정'
  sign_in: '알림을 받기 위해 사용자 데모의 테스트 계정으로 로그인하세요.'
  sign_in_open: '테스트 계정'
  sent: '전송됨. 수신함과 우편함에 있으며, 메일을 끄지 않았다면 그대로 있습니다.'
  sent_none: '전송된 내용이 없습니다 — 당신은 한 시간 이내에 리마인드되었습니다.'
  levels:
    title: '자신에게 하나 전송하기'
    intro: '레벨당 하나의 카테고리, 오직 당신에게만 전송됩니다.'
    info: 정보
    success: 성공
    warning: 경고
    danger: 위험
  reminder:
    title: '1시간마다 알림'
    intro: 'notifyOnce()로 전송됨 — 1시간 이내에 다시 누르면 아무것도 전송되지 않으며, 일일 리마인더가 각 사람에게 한 번만 도달하는 방식입니다.'
    send: '리마인드 해주세요'
  teams:
    title: '팀이 그들의 구성원에게 알립니다'
    intro: '사용자 데모의 팀에 누군가를 추가하거나, 접근 권한을 변경하거나, 제거하면 그들에게 알림이 전송됩니다 — 그리고, 도착 시 다른 관리자에게도 알림이 갑니다.'
    open: '팀 열기'

bn:
  page_title: নোটিফিকেশন
  page_icon: 'ph:bold/bell'
  intro: 'যাদের জানানো উচিত, তাদের জানানো। প্রতিটি নোটিফিকেশন ইনবক্সে এসে পৌঁছে; মেইল হল একটি চ্যানেল যা প্রতিটি শ্রেণীর জন্য বন্ধ করা যেতে পারে। ডেভেলপমেন্টে মেইলগুলি মেইলবক্সে চলে আসে।'
  inbox: ইনবক্স
  preferences: পছন্দসমূহ
  sign_in: 'নোটিফিকেশন পাওয়ার জন্য ব্যবহারকারী ডেমোর পরীক্ষামূলক অ্যাকাউন্ট দিয়ে সাইন ইন করুন।'
  sign_in_open: 'পরীক্ষামূলক অ্যাকাউন্ট'
  sent: 'প্রেরিত। এটি আপনার ইনবক্সে আছে, এবং মেইলবক্সে আছে যতক্ষণ না আপনি মেইল বন্ধ করেন।'
  sent_none: 'কিছুই প্রেরিত হয়নি — আপনাকে এক ঘণ্টার কম সময়ে মনে করিয়ে দেওয়া হয়েছিল।'
  levels:
    title: 'নিজেকে একটি পাঠান'
    intro: 'প্রতি স্তরে একটি শ্রেণী, শুধুমাত্র আপনাকে পাঠানো।'
    info: তথ্য
